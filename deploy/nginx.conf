# =============================================================================
# deploy/nginx.conf
# -----------------------------------------------------------------------------
# Production Nginx virtual host for the BatteryCo marketing site.
#
# Responsibilities:
#   - Serve the static site in /var/www/batteryco/public as document root
#   - Reverse-proxy /api/* to the Node form service on 127.0.0.1:3000
#   - Terminate HTTPS with HTTP/2 (certs managed by certbot / Let's Encrypt)
#   - Redirect HTTP → HTTPS and www → apex
#   - Strong security headers + compression + long-cache static assets
#   - Disallow access to engineering surfaces (_template.html, /partials/)
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/batteryco.conf
#   sudo ln -sf /etc/nginx/sites-available/batteryco.conf \
#              /etc/nginx/sites-enabled/batteryco.conf
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================


# ─── Upstream: Node.js form service (pm2) ───────────────────────────────────
upstream batteryco_api {
    server 127.0.0.1:3000 fail_timeout=10s;
    keepalive 16;
}


# ─── HTTP → HTTPS + www → apex ──────────────────────────────────────────────
server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name www.07691688.xyz 07691688.xyz;

    # Keep the ACME HTTP-01 challenge path open for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.07691688.xyz$request_uri;
    }
}


# ─── Apex → www (keep one canonical origin) ─────────────────────────────────
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;
    server_name 07691688.xyz;

    ssl_certificate     /etc/letsencrypt/live/07691688.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/07691688.xyz/privkey.pem;

    return 301 https://www.07691688.xyz$request_uri;
}


# ─── Main virtual host ──────────────────────────────────────────────────────
server {
    listen      443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2       on;
    server_name www.07691688.xyz;

    root /var/www/batteryco/public;
    index index.html;

    # ─── TLS ────────────────────────────────────────────────────────────
    ssl_certificate           /etc/letsencrypt/live/07691688.xyz/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/07691688.xyz/privkey.pem;
    ssl_trusted_certificate   /etc/letsencrypt/live/07691688.xyz/chain.pem;

    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_tickets       off;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── Uploads ────────────────────────────────────────────────────────
    client_max_body_size        12m;   # resume uploads (D2: 10 MB limit + overhead)
    client_body_buffer_size     128k;
    client_body_timeout         30s;
    client_header_timeout       20s;

    # ─── Security headers ───────────────────────────────────────────────
    add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # Content Security Policy — tune as you add third-party scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://www.google.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # ─── Compression ────────────────────────────────────────────────────
    gzip                    on;
    gzip_vary               on;
    gzip_comp_level         6;
    gzip_min_length         256;
    gzip_proxied            any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/manifest+json
        application/rss+xml
        application/atom+xml
        application/xml
        application/xml+rss
        application/ld+json
        image/svg+xml
        font/ttf
        font/otf;

    # If ngx_brotli is compiled in, enable it alongside gzip.
    # brotli                on;
    # brotli_comp_level     5;
    # brotli_types          text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ─── Clean URL rewrites ─────────────────────────────────────────────
    # Allow visiting /en/products/ (directory) and fall through to
    # index.html inside it; allow .html on detail pages; disallow
    # engineering surfaces.

    # /partials/ is intentionally reachable — partials-loader.js fetches
    # header/footer/cookie-bar from there at runtime.
    location = /_template.html { return 404; }
    location ^~ /.git          { deny all; return 404; }
    location = /robots.txt     { log_not_found off; access_log off; }
    location = /favicon.svg    { log_not_found off; access_log off; expires 30d; }
    location = /favicon.ico    { log_not_found off; access_log off; expires 30d; }
    location = /site.webmanifest { log_not_found off; access_log off; expires 7d; }
    location = /sitemap.xml    { log_not_found off; access_log off; }

    # ─── API reverse proxy ──────────────────────────────────────────────
    location /api/ {
        proxy_pass              http://batteryco_api;
        proxy_http_version      1.1;
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection      "";
        proxy_read_timeout      30s;
        proxy_send_timeout      30s;
        proxy_connect_timeout   5s;

        # Don't let upstream override our strict security headers
        proxy_hide_header       Strict-Transport-Security;
        proxy_hide_header       X-Frame-Options;
        proxy_hide_header       X-Content-Type-Options;
        proxy_hide_header       Content-Security-Policy;
    }

    # ─── Static assets: long cache + immutable ──────────────────────────
    # All hashed/static assets under /assets/ can be cached for a year.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Images (cached, range requests supported)
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Fonts (CORS for same-origin; long cache)
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    # HTML pages — short cache with revalidation; rely on ETag
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # ─── Default: serve static site, clean dir URLs ─────────────────────
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Redirect bare "/" to /en/ (English is the default locale)
    location = / {
        return 302 /en/;
    }

    # ─── Error pages ────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html { internal; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }

    # ─── Logs ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/batteryco.access.log;
    error_log  /var/log/nginx/batteryco.error.log warn;
}
