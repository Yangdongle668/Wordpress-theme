# =============================================================================
# deploy/nginx-docker.conf  —  mounted at /etc/nginx/conf.d/default.conf
# -----------------------------------------------------------------------------
# Production vhost for 07691688.xyz running inside the docker-compose stack
# (public:ro, certbot-etc:ro, certbot-www:ro volumes; `form` service on the
# shared backend network).
# =============================================================================


# ─── Upstream: Node.js form container ──────────────────────────────────────
upstream batteryco_api {
    server form:3000 fail_timeout=10s;
    keepalive 16;
}


# ─── HTTP → HTTPS + apex → www ─────────────────────────────────────────────
server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name 07691688.xyz www.07691688.xyz;

    # Let's Encrypt HTTP-01 challenge (kept open during renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.07691688.xyz$request_uri;
    }
}


# ─── Apex HTTPS → www (single canonical origin) ────────────────────────────
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;
    server_name 07691688.xyz;

    ssl_certificate     /etc/letsencrypt/live/07691688.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/07691688.xyz/privkey.pem;

    # Mozilla "intermediate" TLS baseline (inlined to avoid depending on an
    # externally downloaded options-ssl-nginx.conf).
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_tickets       off;

    return 301 https://www.07691688.xyz$request_uri;
}


# ─── Main vhost ─────────────────────────────────────────────────────────────
server {
    listen      443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2       on;
    server_name www.07691688.xyz;

    root  /usr/share/nginx/html;
    index index.html;

    # ─── TLS (Mozilla intermediate, inlined) ───────────────────────────
    ssl_certificate           /etc/letsencrypt/live/07691688.xyz/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/07691688.xyz/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_tickets       off;

    # ─── Uploads ────────────────────────────────────────────────────────
    client_max_body_size        12m;
    client_body_buffer_size     128k;
    client_body_timeout         30s;
    client_header_timeout       20s;

    # ─── Security headers ───────────────────────────────────────────────
    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Frame-Options              "SAMEORIGIN" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # ─── Compression ────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/json application/javascript application/xml
        application/ld+json application/rss+xml application/atom+xml
        application/manifest+json image/svg+xml font/ttf font/otf;

    # ─── Let's Encrypt challenges (shared webroot) ─────────────────────
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # ─── Engineering surfaces: deny ─────────────────────────────────────
    # /partials/ is intentionally reachable — partials-loader.js fetches
    # header/footer/cookie-bar from there at runtime.
    location = /_template.html { return 404; }
    location ^~ /.git          { deny all; return 404; }

    # ─── Root convenience files ─────────────────────────────────────────
    location = /robots.txt       { log_not_found off; access_log off; }
    location = /favicon.svg      { log_not_found off; access_log off; expires 30d; }
    location = /favicon.ico      { log_not_found off; access_log off; expires 30d; }
    location = /site.webmanifest { log_not_found off; access_log off; expires 7d; }
    location = /sitemap.xml      { log_not_found off; access_log off; }

    # ─── API → Node form service ────────────────────────────────────────
    location /api/ {
        proxy_pass              http://batteryco_api;
        proxy_http_version      1.1;
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection      "";
        proxy_read_timeout      30s;
        proxy_send_timeout      30s;
        proxy_connect_timeout   5s;

        # Don't let upstream clobber the strict headers defined above
        proxy_hide_header       Strict-Transport-Security;
        proxy_hide_header       X-Frame-Options;
        proxy_hide_header       X-Content-Type-Options;
        proxy_hide_header       Content-Security-Policy;
    }

    # ─── Static assets: long cache + immutable ─────────────────────────
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Images (cached, range requests supported)
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Fonts (self-hosted woff2; CORS open for same-origin use)
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    # HTML pages — short cache, revalidate
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # ─── Default static routing with clean directory URLs ──────────────
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Redirect bare "/" to /en/ (English default locale)
    location = / { return 302 /en/; }

    # ─── Error pages ────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html { internal; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
