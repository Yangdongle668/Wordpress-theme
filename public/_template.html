<!doctype html>
<html lang="en" class="no-js" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ─── Primary meta (replace per-page) ────────────────────────────── -->
  <title>{{Page title}} — BatteryCo</title>
  <meta name="description" content="{{Page description, 150–160 chars, natural keywords}}" />
  <meta name="author" content="BatteryCo" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="theme-color" content="#171A20" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0C0F" media="(prefers-color-scheme: dark)" />

  <!-- ─── Canonical + i18n ───────────────────────────────────────────── -->
  <link rel="canonical" href="https://www.07691688.xyz/en/{{slug}}" />
  <link rel="alternate" hreflang="en" href="https://www.07691688.xyz/en/{{slug}}" />
  <link rel="alternate" hreflang="zh" href="https://www.07691688.xyz/zh/{{slug}}" />
  <link rel="alternate" hreflang="x-default" href="https://www.07691688.xyz/en/{{slug}}" />

  <!-- ─── Open Graph ─────────────────────────────────────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BatteryCo" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="{{Page title}} — BatteryCo" />
  <meta property="og:description" content="{{Page description}}" />
  <meta property="og:url" content="https://www.07691688.xyz/en/{{slug}}" />
  <meta property="og:image" content="https://www.07691688.xyz/assets/images/og/{{slug}}.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{Image alt text}}" />

  <!-- ─── Twitter Card ───────────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{Page title}}" />
  <meta name="twitter:description" content="{{Page description}}" />
  <meta name="twitter:image" content="https://www.07691688.xyz/assets/images/og/{{slug}}.jpg" />

  <!-- ─── Favicon / PWA ──────────────────────────────────────────────── -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- ─── Stylesheets (order matters: tokens → base → components → page) -->
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base/fonts.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/base/prose.css" />
  <link rel="stylesheet" href="/assets/css/base/loading.css" />
  <link rel="stylesheet" href="/assets/css/components/buttons.css" />
  <link rel="stylesheet" href="/assets/css/components/cards.css" />
  <link rel="stylesheet" href="/assets/css/components/forms.css" />
  <link rel="stylesheet" href="/assets/css/components/nav.css" />
  <link rel="stylesheet" href="/assets/css/components/footer.css" />
  <link rel="stylesheet" href="/assets/css/components/misc.css" />
  <!-- Per-page stylesheet: <link rel="stylesheet" href="/assets/css/pages/{{page}}.css" /> -->

  <!-- ─── Preconnect / preload hints (uncomment as needed) ───────────── -->
  <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->
  <!-- <link rel="preload" as="image" href="/assets/images/home/hero.webp" /> -->

  <!-- ─── Inline: flip html class before CSS paints (avoid FOUC) ─────── -->
  <script>
    document.documentElement.classList.replace('no-js', 'js');
    try {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>

  <!-- ─── JSON-LD structured data ────────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "BatteryCo",
    "url": "https://www.07691688.xyz/",
    "logo": "https://www.07691688.xyz/assets/images/logo.png",
    "sameAs": [
      "https://www.linkedin.com/company/example",
      "https://twitter.com/example"
    ],
    "contactPoint": [{
      "@type": "ContactPoint",
      "contactType": "sales",
      "email": "contact@example.com",
      "telephone": "+86-000-0000-0000",
      "areaServed": "Worldwide",
      "availableLanguage": ["en", "zh"]
    }]
  }
  </script>

  <!-- Page-specific JSON-LD: WebPage / Product / Article / BreadcrumbList -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "{{Page title}}",
    "description": "{{Page description}}",
    "url": "https://www.07691688.xyz/en/{{slug}}",
    "inLanguage": "en",
    "isPartOf": { "@type": "WebSite", "name": "BatteryCo", "url": "https://www.07691688.xyz/" }
  }
  </script>
</head>

<body>
  <!-- Header partial (injected by partials-loader.js) -->
  <div data-include="/partials/header.html"></div>

  <main id="main" tabindex="-1">
    <!-- ═══════════════════ PAGE CONTENT BEGINS ═══════════════════ -->

    <!-- Remove this placeholder when authoring a real page. -->
    <section class="hero" data-header-bg="dark">
      <div class="container container--xl text-center">
        <p class="text-eyebrow" data-reveal="fade">Template</p>
        <h1 class="display" data-reveal="up" style="--stagger: 1">
          Replace me with the real page title
        </h1>
        <p class="lead" data-reveal="up" style="--stagger: 2">
          Replace this paragraph with the hero subtitle.
        </p>
        <div class="btn-group mt-8" data-reveal="up" style="--stagger: 3">
          <a class="btn btn--primary btn--lg" href="#">Primary CTA</a>
          <a class="btn btn--outline btn--lg" href="#">Secondary CTA</a>
        </div>
      </div>
    </section>

    <!-- ═══════════════════  PAGE CONTENT ENDS  ═══════════════════ -->
  </main>

  <!-- Footer partial -->
  <div data-include="/partials/footer.html"></div>

  <!-- Cookie consent -->
  <div data-include="/partials/cookie.html"></div>

  <!-- Back-to-top (simple markup; JS handles visibility) -->
  <button type="button" class="back-to-top" data-back-to-top aria-label="Back to top">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
      <path fill="currentColor" d="M8 3l5 5-1.4 1.4L9 6.8V13H7V6.8L4.4 9.4 3 8z"/>
    </svg>
  </button>

  <!-- ─── Scripts (defer, in dependency order) ─────────────────────── -->
  <script defer src="/assets/js/partials-loader.js"></script>
  <script defer src="/assets/js/header.js"></script>
  <script defer src="/assets/js/mobile-nav.js"></script>
  <script defer src="/assets/js/reveal.js"></script>
  <script defer src="/assets/js/back-to-top.js"></script>
  <script defer src="/assets/js/main.js"></script>
  <!-- Per-page script: <script defer src="/assets/js/pages/{{page}}.js"></script> -->
</body>
</html>
